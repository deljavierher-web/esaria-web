<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estudio de camino · GCPP</title>
<style>
  :root{ --bg:#0f1420; --card:#1b2434; --card2:#222d40; --accent:#4f9dff; --good:#39c46e; --bad:#ff5d6c; --txt:#eaf0fa; --mut:#9fb0c9; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); padding-bottom:80px;}
  header{position:sticky; top:0; background:linear-gradient(180deg,#0f1420 70%,rgba(15,20,32,0)); padding:14px 16px 8px; z-index:10;}
  h1{font-size:18px; margin:0 0 10px;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{flex:1; min-width:60px; text-align:center; padding:9px 6px; border-radius:12px; background:var(--card); color:var(--mut); font-size:13px; font-weight:600; border:1px solid #2a3650;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .modebar{display:flex; gap:8px; margin-top:8px;}
  .mode{flex:1; text-align:center; padding:8px; border-radius:10px; background:#141c2b; color:var(--mut); font-size:13px; font-weight:700; border:1px solid #243150;}
  .mode.active{background:var(--card2); color:var(--txt);}
  main{padding:6px 16px;}
  .counter{color:var(--mut); font-size:12px; text-align:center; margin:8px 0;}
  .card{background:var(--card); border:1px solid #2a3650; border-radius:18px; padding:20px; margin:10px 0; min-height:140px; display:flex; flex-direction:column; justify-content:center;}
  .q{font-size:17px; line-height:1.45; font-weight:600;}
  .tag{display:inline-block; font-size:11px; color:var(--accent); font-weight:700; margin-bottom:10px; letter-spacing:.5px;}
  .ans{margin-top:14px; padding-top:14px; border-top:1px dashed #34425f; color:var(--txt); font-size:15.5px; line-height:1.5; display:none;}
  .ans.show{display:block;}
  .ans ul{margin:6px 0 0; padding-left:18px;} .ans li{margin:3px 0;}
  .hint{color:var(--mut); font-size:13px; text-align:center; margin-top:6px;}
  .opts{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .opt{padding:13px 14px; border-radius:12px; background:#141c2b; border:1px solid #28344e; font-size:15px; line-height:1.35;}
  .opt.correct{background:rgba(57,196,110,.18); border-color:var(--good);}
  .opt.wrong{background:rgba(255,93,108,.16); border-color:var(--bad);}
  .nav{position:fixed; bottom:0; left:0; right:0; display:flex; gap:10px; padding:12px 16px; background:linear-gradient(0deg,#0f1420 70%,rgba(15,20,32,0));}
  .btn{flex:1; padding:15px; border-radius:14px; border:none; font-size:16px; font-weight:700; background:var(--card2); color:var(--txt);}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn:active{transform:scale(.97);}
  .flip-hint{font-size:12px;color:var(--mut);text-align:center;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>📚 Estudio de camino · Calidad, PRL y Medio Ambiente</h1>
  <div class="row" id="muestras"></div>
  <div class="modebar" id="modes">
    <div class="mode active" data-m="flash">Tarjetas</div>
    <div class="mode" data-m="test">Test</div>
    <div class="mode" data-m="dev">Desarrollo</div>
  </div>
</header>
<main>
  <div class="counter" id="counter"></div>
  <div id="stage"></div>
  <div class="hint" id="hint">Toca la tarjeta para ver la respuesta</div>
</main>
<div class="nav">
  <button class="btn" id="prev">‹ Anterior</button>
  <button class="btn primary" id="next">Siguiente ›</button>
</div>

<script>
/* ============ CONTENIDO ============ */
const M = ["M1 Aseguramiento","M2 Gestión Calidad","M3 PRL","M4 Medio Amb.","M5 Residuos"];

const FLASH = [

 [["Calidad","Capacidad de un producto/servicio de satisfacer las necesidades y expectativas del cliente. ISO 9000: grado en que unas características cumplen los requisitos."],

 // M2
 [["Costes de calidad","Lo que cuesta hacerlo bien + lo que cuesta hacerlo mal. 4 categorías."],

 [["Residuo","Sustancia u objeto que su poseedor deseche o tenga intención/obligación de desechar."],

const DEV = [
 // M1
 [["Explica el concepto de calidad y su evolución.","Calidad = capacidad de satisfacer las necesidades y expectativas del cliente (ISO 9000: grado en que unas características cumplen los requisitos). Evolución en 4 etapas: 1) Inspección (control final), 2) Control de calidad (estadístico del proceso), 3) Aseguramiento (prevención con sistema documentado, ISO 9000), 4) Calidad total (TQM: toda la empresa, mejora continua)."],
  ["Normalización, certificación y acreditación.","Normalización: crear y aplicar normas (UNE/CEN/ISO) para simplificar, unificar y especificar. Certificación: una entidad independiente (AENOR) garantiza que algo cumple una norma. Acreditación: la ENAC autoriza y da validez a las entidades certificadoras."],

  ["Mapa de procesos y sus 3 niveles.","Representación gráfica de los procesos y sus relaciones. Niveles: Estratégicos (dirección, marcan directrices), Operativos/clave (realización del producto, aportan valor), De apoyo (soporte: mantenimiento, RRHH, compras)."],

/* ============ LÓGICA ============ */
let muestra=0, mode="flash", idx=0, answered=false;
const stage=document.getElementById('stage'), counter=document.getElementById('counter'), hint=document.getElementById('hint');

// pintar chips
const mc=document.getElementById('muestras');
M.forEach((m,i)=>{const d=document.createElement('div'); d.className='chip'+(i==0?' active':''); d.textContent=m; d.onclick=()=>{muestra=i; idx=0; [...mc.children].forEach(c=>c.classList.remove('active')); d.classList.add('active'); render();}; mc.appendChild(d);});
document.querySelectorAll('.mode').forEach(el=>{el.onclick=()=>{mode=el.dataset.m; idx=0; document.querySelectorAll('.mode').forEach(m=>m.classList.remove('active')); el.classList.add('active'); render();};});

function data(){ return mode=="flash"?FLASH[muestra] : mode=="test"?TEST[muestra] : DEV[muestra]; }

function render(){
  const d=data(); if(idx>=d.length) idx=0; if(idx<0) idx=d.length-1;
  answered=false;
  counter.textContent=`${M[muestra]} · ${idx+1}/${d.length}`;
  const item=d[idx];
  if(mode=="flash"){
    hint.textContent="Toca la tarjeta para ver la definición";
    stage.innerHTML=`<div class="card" id="card"><span class="tag">TARJETA</span><div class="q">${item[0]}</div><div class="ans" id="ans">${item[1]}</div></div>`;
    document.getElementById('card').onclick=()=>document.getElementById('ans').classList.toggle('show');
  } else if(mode=="dev"){
    hint.textContent="Toca para ver la respuesta modelo";
    stage.innerHTML=`<div class="card" id="card"><span class="tag">DESARROLLO</span><div class="q">${item[0]}</div><div class="ans" id="ans">${item[1]}</div></div>`;
    document.getElementById('card').onclick=()=>document.getElementById('ans').classList.toggle('show');
  } else {
    hint.textContent="Toca la opción que creas correcta";
    const opts=item[1].map((o,i)=>`<div class="opt" data-i="${i}">${o}</div>`).join('');
    stage.innerHTML=`<div class="card"><span class="tag">TEST</span><div class="q">${item[0]}</div><div class="opts" id="opts">${opts}</div></div>`;
    document.querySelectorAll('#opts .opt').forEach(op=>{op.onclick=()=>{
      if(answered) return; answered=true; const correct=item[2];
      document.querySelectorAll('#opts .opt').forEach(o=>{const i=+o.dataset.i; if(i==correct)o.classList.add('correct'); else if(i==+op.dataset.i)o.classList.add('wrong');});
    };});
  }
}
document.getElementById('next').onclick=()=>{idx++; render();};
document.getElementById('prev').onclick=()=>{idx--; render();};
render();
</script>
</body>
</html>
